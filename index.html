<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Vintage Diary - Pro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #eae6db; 
      --book-bg: #F4EFE6; 
      --text-color: #3e3a35;
      --primary: #8c7b6c; 
      --danger: #c47b6a;
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; 
      background: var(--bg-color); 
      color: var(--text-color); 
      font-family: 'Segoe UI', Tahoma, sans-serif; 
      overflow-x: hidden; 
    }
    
    .screen { display: none; min-height: 100vh; padding: 20px; }
    .screen.active { display: block; }

    /* --- Màn hình Khóa --- */
    #lock-screen { flex-direction: column; align-items: center; justify-content: center; background: var(--bg-color); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; }
    #lock-screen.active { display: flex; }
    #lock-title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 20px; color: #4a4238; }
    .pin-input { font-size: 2rem; padding: 10px; width: 200px; text-align: center; border: 1px solid var(--primary); border-radius: 4px; margin-bottom: 20px; letter-spacing: 5px; background: transparent; color: #4a4238; outline: none; }
    
    /* --- Thiết kế Nút Tối giản --- */
    .btn { padding: 8px 18px; font-size: 0.95rem; border: 1px solid var(--primary); border-radius: 4px; cursor: pointer; background: transparent; color: var(--primary); font-weight: 600; transition: all 0.3s ease; }
    .btn:hover { background: var(--primary); color: #fff; }
    .btn-text { border: none; background: transparent; color: var(--primary); padding: 8px 12px; }
    .btn-text:hover { background: rgba(140, 123, 108, 0.1); color: var(--primary); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-danger-text { border: none; color: var(--danger); }
    .btn-danger-text:hover { background: rgba(196, 123, 106, 0.1); color: var(--danger); }
    .btn-primary-filled { background: var(--primary); color: #fff; }
    .btn-primary-filled:hover { opacity: 0.8; }

    /* --- Giao diện Quản lý (Dashboard) --- */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #d4cdc1; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
    .header h2 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; margin: 0; font-weight: 600; }
    .header-actions { display: flex; gap: 10px; }
    .books-grid { display: flex; gap: 50px; flex-wrap: wrap; justify-content: center; padding: 20px; perspective: 1200px; }
    
    /* --- Bìa sách Aesthetic & Kéo Thả (Drag & Drop) --- */
    .book { width: 200px; height: 280px; background: var(--book-bg); padding: 12px; border-radius: 2px 8px 8px 2px; box-shadow: 5px 10px 20px rgba(0,0,0,0.15), inset 4px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: grab; transform: rotateY(-15deg); border-left: 6px solid #d3c7b2; }
    .book:hover { transform: rotateY(0deg) scale(1.05) translateY(-5px); }
    .book:active { cursor: grabbing; }
    .book.dragging { opacity: 0.5; transform: scale(0.95); }
    
    .book-cover-img { width: 100%; height: 75%; background-size: cover; background-position: center; border: 1px solid rgba(0,0,0,0.1); box-shadow: inset 0 0 5px rgba(0,0,0,0.2); pointer-events: none; }
    .book-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: #3e3a35; text-align: center; margin-top: auto; padding-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    
    /* Tránh xung đột sự kiện kéo thả với nút xóa */
    .book-delete-btn { position: absolute; top: -10px; right: -10px; background: var(--book-bg); color: var(--danger); border: 1px solid var(--danger); width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; z-index: 10; transition: 0.2s; }
    .book-delete-btn:hover { background: var(--danger); color: white; transform: scale(1.1); }

    /* --- Xếp trang 3D --- */
    .book-view-stack { position: relative; width: 300px; height: 420px; margin: 40px auto; perspective: 1500px; }
    .page-sheet { position: absolute; width: 100%; height: 100%; border-radius: 2px 8px 8px 2px; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); border-left: 2px solid rgba(0,0,0,0.05); transform-origin: left center; transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); padding: 30px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .page-sheet:hover { transform: rotateY(-20deg) translateX(-15px) !important; box-shadow: 8px 10px 20px rgba(0,0,0,0.15); }
    .page-sheet-date { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: #555; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; width: 90%; text-align: center; }

    /* --- Trình Soạn thảo --- */
    .editor-header-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .editor-toolbar { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #d4cdc1; transition: opacity 0.3s ease; }
    #editor-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; border: none; outline: none; width: 100%; margin-bottom: 10px; background: transparent; font-weight: 600; color: #3e3a35; }
    #editor-content { min-height: 60vh; background: transparent; outline: none; font-size: 1.15rem; line-height: 1.8; color: #4a4238; }
    #editor-content img { max-width: 100%; border-radius: 2px; margin: 20px 0; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .save-status { font-size: 0.85rem; color: #888; margin-left: auto; align-self: center; font-style: italic; }
    
    .read-only-mode #editor-title { color: #5c554d; }
    .read-only-mode #editor-content { color: #5c554d; }

    /* --- Hệ thống Hộp thoại (Modals) --- */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .modal-content { background: var(--book-bg); padding: 30px; border-radius: 4px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #d4cdc1; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .modal-content h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; margin-top: 0; margin-bottom: 15px; color: #3e3a35;}
    .book-list-modal { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; max-height: 200px; overflow-y: auto; }
    .book-option { padding: 10px; background: transparent; border: 1px solid #d4cdc1; border-radius: 4px; cursor: pointer; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: #5c554d; }
    .book-option:hover { background: #eae6db; border-color: var(--primary); color: var(--primary); }
    .input-book-name { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d4cdc1; border-radius: 4px; background: transparent; outline: none; font-family: 'Segoe UI', sans-serif; color: #3e3a35; }
    .input-book-name:focus { border-color: var(--primary); }
    
    /* Trạng thái xác nhận khi Copy-Paste thành công */
    .paste-success-msg { display: none; font-size: 0.85rem; color: #6a9c78; font-weight: bold; margin-bottom: 15px; font-style: italic; }

    /* --- Responsive --- */
    @media screen and (max-width: 768px) {
      .books-grid { gap: 25px; padding: 10px; }
      .book { width: 160px; height: 230px; }
      .book-view-stack { width: 260px; height: 360px; }
    }
    @media screen and (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-actions, .editor-header-group { width: 100%; justify-content: flex-start; }
      .book { width: 140px; height: 200px; }
      .book-view-stack { width: 220px; height: 310px; }
    }
  </style>
</head>
<body>

  <!-- Hệ thống Xác thực -->
  <div id="lock-screen" class="screen active">
    <h2 id="lock-title">Mật mã Nhật ký</h2>
    <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
    <button class="btn btn-primary-filled" onclick="checkPin()">Mở Khóa Không Gian</button>
  </div>

  <!-- Thư viện Tổng quan -->
  <div id="dashboard" class="screen">
    <div class="header">
      <h2>Thư Viện Ký Ức</h2>
      <div class="header-actions">
        <button class="btn" onclick="openCreateBookModal()">Tạo Sách Mới</button>
        <button class="btn btn-primary-filled" onclick="openEditor(null)">Chắp Bút</button>
      </div>
    </div>
    <div class="books-grid" id="books-container"></div>
  </div>

  <!-- Không gian Sách -->
  <div id="book-view" class="screen">
    <div class="header">
      <h2 id="current-book-title">Đang kết xuất...</h2>
      <div class="header-actions">
        <button class="btn btn-text" onclick="switchScreen('dashboard')">← Trở về</button>
        <button class="btn btn-primary-filled" onclick="openEditor(null, true)">Thêm Trang</button>
      </div>
    </div>
    <div class="book-view-stack" id="pages-container"></div>
  </div>

  <!-- Trình Soạn thảo Văn bản -->
  <div id="editor-screen" class="screen">
    <div class="header">
      <div class="editor-header-group">
        <button class="btn btn-text" onclick="goBackFromEditor()">← Trở về</button>
        <button class="btn btn-primary-filled" id="btn-toggle-edit" onclick="handleEditToggle()">Chỉnh Sửa</button>
      </div>
      <div class="editor-header-group" id="editor-secondary-actions">
        <button class="btn btn-text" id="btn-change-location" onclick="showSaveModal()">Đổi Vị Trí</button>
        <button class="btn btn-danger-text" id="btn-delete-page" onclick="deleteCurrentPage()">Xóa Trang</button>
      </div>
    </div>
    
    <div class="editor-toolbar" id="editor-toolbar">
      <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="insertImage(event)">
      <button class="btn btn-text" onclick="document.getElementById('image-upload').click()">+ Đính kèm Ảnh</button>
      <span class="save-status" id="save-status"></span>
    </div>

    <input type="text" id="editor-title" placeholder="Tiêu đề ngày hôm nay (Tùy chọn)...">
    <div id="editor-content" placeholder="Những dòng suy nghĩ tĩnh lặng..."></div>
  </div>

  <!-- Hộp thoại Phân loại Lưu trữ / Đổi vị trí -->
  <div id="modal-save" class="modal">
    <div class="modal-content">
      <h3 id="modal-save-title">Chọn Vị trí Lưu trữ</h3>
      <div class="book-list-modal" id="modal-book-list"></div>
      <p style="margin: 10px 0; font-style: italic; font-size: 0.9rem; color: #777;">Hoặc đưa vào miền ký ức mới</p>
      <input type="text" id="new-book-name" class="input-book-name" placeholder="Tên cuốn sách mới...">
      
      <label for="cover-upload" style="display:block; margin-bottom: 5px; font-weight: 600; cursor: pointer; color: var(--primary); font-size: 0.95rem;">
        [+] Chọn Tệp tin
      </label>
      <p style="font-size: 0.8rem; color: #888; margin-top: 0; margin-bottom: 10px;">Hoặc nhấn Ctrl+V (Cmd+V) để dán ảnh</p>
      
      <div id="save-paste-msg" class="paste-success-msg">✓ Đã nhận ảnh từ khay nhớ tạm!</div>
      <input type="file" id="cover-upload" accept="image/*" style="display: none;">
      
      <button class="btn btn-primary-filled" style="width: 100%;" onclick="executeSaveAction()">Xác nhận Vị trí</button>
      <button class="btn btn-text" style="width: 100%; margin-top: 5px;" onclick="closeModals()">Hủy lệnh</button>
    </div>
  </div>

  <!-- Hộp thoại Khởi tạo Sách Mới -->
  <div id="modal-create-book" class="modal">
    <div class="modal-content">
      <h3>Khởi Tạo Sách Mới</h3>
      <input type="text" id="only-new-book-name" class="input-book-name" placeholder="Tên cuốn sách...">
      
      <label for="only-cover-upload" style="display:block; margin-bottom: 5px; font-weight: 600; cursor: pointer; color: var(--primary); font-size: 0.95rem;">
        [+] Chọn Tệp tin Bìa (Tùy chọn)
      </label>
      <p style="font-size: 0.8rem; color: #888; margin-top: 0; margin-bottom: 10px;">Hoặc nhấn Ctrl+V (Cmd+V) để dán ảnh</p>
      
      <div id="create-paste-msg" class="paste-success-msg">✓ Đã nhận ảnh từ khay nhớ tạm!</div>
      <input type="file" id="only-cover-upload" accept="image/*" style="display: none;">
      
      <button class="btn btn-primary-filled" style="width: 100%;" onclick="executeCreateBook()">Tạo Sách</button>
      <button class="btn btn-text" style="width: 100%; margin-top: 5px;" onclick="closeModals()">Hủy lệnh</button>
    </div>
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('diary_db')) || { books: [], pages: [], passcode: null };
    let currentPageId = null;
    let preSelectedBookId = null; 
    let typingTimer;
    let isEditMode = true; 
    let dragStartIndex = null; // Quản lý trạng thái Kéo/Thả
    
    const fallbackColors = ['#f5e6e6', '#e6f0e6', '#e6eaf5', '#f5eee6', '#f2e6f5'];

    if (!db.passcode) document.getElementById('lock-title').innerText = "Thiết lập Mật mã Khởi tạo";

    // Mật mã
    document.getElementById('pin-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkPin();
    });

    function checkPin() {
      const input = document.getElementById('pin-input').value;
      if (!input) return alert("Vui lòng cung cấp khóa định danh.");
      if (!db.passcode) {
        db.passcode = input;
        saveDB();
        switchScreen('dashboard');
        renderBooks();
      } else {
        if (input === db.passcode) {
          switchScreen('dashboard');
          renderBooks();
        } else {
          alert("Lỗi xác thực: Khóa định danh không hợp lệ.");
        }
      }
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // --- Thuật toán Kéo Thả (Drag & Drop Reordering) ---
    function handleDragStart(e, index) {
      dragStartIndex = index;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => e.target.classList.add('dragging'), 0);
    }
    
    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
    }
    
    function handleDragOver(e) {
      e.preventDefault(); 
      e.dataTransfer.dropEffect = 'move';
    }
    
    function handleDrop(e, dropIndex) {
      e.preventDefault();
      if (dragStartIndex !== null && dragStartIndex !== dropIndex) {
        const movedBook = db.books.splice(dragStartIndex, 1)[0];
        db.books.splice(dropIndex, 0, movedBook);
        saveDB();
        renderBooks();
      }
      dragStartIndex = null;
    }

    // Kết xuất Tổng quan Sách
    function renderBooks() {
      const container = document.getElementById('books-container');
      container.innerHTML = '';
      db.books.forEach((book, index) => {
        const bgImg = book.cover ? `background-image: url('${book.cover}');` : `background-color: #d4cdc1;`;
        
        // Khởi tạo phần tử DOM để đính kèm Event Listeners Kéo thả
        const bookEl = document.createElement('div');
        bookEl.className = 'book';
        bookEl.draggable = true;
        
        // Event Listeners cho Drag & Drop
        bookEl.addEventListener('dragstart', (e) => handleDragStart(e, index));
        bookEl.addEventListener('dragend', handleDragEnd);
        bookEl.addEventListener('dragover', handleDragOver);
        bookEl.addEventListener('drop', (e) => handleDrop(e, index));
        bookEl.addEventListener('click', () => openBook(book.id));
        
        bookEl.innerHTML = `
          <div class="book-delete-btn" onclick="deleteBook('${book.id}', event)">✖</div>
          <div class="book-cover-img" style="${bgImg}"></div>
          <div class="book-title">${book.name}</div>
        `;
        container.appendChild(bookEl);
      });
    }

    function deleteBook(bookId, event) {
      event.stopPropagation();
      const pass = prompt("CẢNH BÁO: Thao tác này sẽ xóa toàn bộ nội dung bên trong. Nhập mật mã để xác nhận:");
      if (pass === db.passcode) {
        db.books = db.books.filter(b => b.id !== bookId);
        db.pages = db.pages.filter(p => p.bookId !== bookId);
        saveDB();
        renderBooks();
      } else if (pass !== null) {
        alert("Lỗi xác thực: Thao tác bị hủy bỏ.");
      }
    }

    function openBook(bookId) {
      preSelectedBookId = bookId; 
      const book = db.books.find(b => b.id === bookId);
      document.getElementById('current-book-title').innerText = book.name;
      const container = document.getElementById('pages-container');
      container.innerHTML = '';
      
      const pages = db.pages.filter(p => p.bookId === bookId).sort((a,b) => b.timestamp - a.timestamp);
      if (pages.length === 0) {
        container.innerHTML = '<p style="text-align:center; font-style:italic;">Cuốn sách này chưa có vết mực nào.</p>';
      }
      
      pages.forEach((page, index) => {
        const dateStr = new Date(page.timestamp).toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = new Date(page.timestamp).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const palette = (book.palette && book.palette.length > 0) ? book.palette : fallbackColors;
        const pageColor = palette[index % palette.length];
        const zIndex = pages.length - index;
        const offsetZ = index * -2;
        const offsetX = index * 3;
        const offsetY = index * 2;

        const pageEl = document.createElement('div');
        pageEl.className = 'page-item-3d';
        pageEl.innerHTML = `
          <div class="page-sheet" style="background-color: ${pageColor}; z-index: ${zIndex}; transform: translate3d(${offsetX}px, ${offsetY}px, ${offsetZ}px);" onclick="openEditor('${page.id}')">
            <div class="page-sheet-date">${dateStr}<br><span style="font-size: 1rem;">${timeStr}</span></div>
          </div>
        `;
        container.appendChild(pageEl);
      });
      switchScreen('book-view');
    }

    // --- Quản lý Chế độ Đọc/Ghi ---
    function setEditorMode(editMode) {
      isEditMode = editMode;
      const titleEl = document.getElementById('editor-title');
      const contentEl = document.getElementById('editor-content');
      const toolbarEl = document.getElementById('editor-toolbar');
      const toggleBtn = document.getElementById('btn-toggle-edit');
      const editorScreen = document.getElementById('editor-screen');

      if (isEditMode) {
        titleEl.readOnly = false;
        contentEl.setAttribute('contenteditable', 'true');
        toolbarEl.style.display = 'flex';
        editorScreen.classList.remove('read-only-mode');
        toggleBtn.innerText = 'Lưu Nội Dung';
        toggleBtn.className = 'btn btn-primary-filled';
        contentEl.focus();
      } else {
        titleEl.readOnly = true;
        contentEl.setAttribute('contenteditable', 'false');
        toolbarEl.style.display = 'none';
        editorScreen.classList.add('read-only-mode');
        toggleBtn.innerText = 'Chỉnh Sửa';
        toggleBtn.className = 'btn btn-text';
      }
    }

    function handleEditToggle() {
      if (isEditMode) savePageDirectly(false); 
      else setEditorMode(true);
    }

    function openEditor(pageId = null, fromBook = false) {
      currentPageId = pageId;
      if (!fromBook && !pageId) preSelectedBookId = null; 
      document.getElementById('editor-secondary-actions').style.display = pageId ? 'flex' : 'none';

      const titleEl = document.getElementById('editor-title');
      const contentEl = document.getElementById('editor-content');
      
      if (pageId) {
        const page = db.pages.find(p => p.id === pageId);
        titleEl.value = page.title;
        contentEl.innerHTML = page.content;
        setEditorMode(false);
      } else {
        titleEl.value = '';
        contentEl.innerHTML = '';
        document.getElementById('save-status').innerText = '';
        setEditorMode(true);
      }
      switchScreen('editor-screen');
    }

    function goBackFromEditor() {
      if (preSelectedBookId) openBook(preSelectedBookId);
      else { switchScreen('dashboard'); renderBooks(); }
    }

    function deleteCurrentPage() {
      const pass = prompt("Yêu cầu nhập mật mã để xác thực lệnh XÓA TRANG:");
      if (pass === db.passcode) {
        db.pages = db.pages.filter(p => p.id !== currentPageId);
        saveDB();
        goBackFromEditor();
      } else if (pass !== null) {
        alert("Lỗi xác thực: Thao tác bị hủy bỏ.");
      }
    }

    function savePageDirectly(goBack = false) {
      const title = document.getElementById('editor-title').value;
      const content = document.getElementById('editor-content').innerHTML;

      if (currentPageId) {
        const page = db.pages.find(p => p.id === currentPageId);
        page.title = title; page.content = content;
        saveDB();
        setEditorMode(false); 
        if (goBack) goBackFromEditor();
      } else if (preSelectedBookId) {
        const newPageId = 'page_' + Date.now();
        db.pages.push({ id: newPageId, bookId: preSelectedBookId, title: title, content: content, timestamp: Date.now() });
        saveDB();
        currentPageId = newPageId; 
        document.getElementById('editor-secondary-actions').style.display = 'flex';
        setEditorMode(false);
        if (goBack) goBackFromEditor();
      } else {
        showSaveModal();
      }
    }

    // --- Quản lý Khay nhớ tạm (Clipboard / Copy-Paste) cho Ảnh Bìa ---
    document.addEventListener('paste', function(e) {
      const modalSaveVisible = document.getElementById('modal-save').style.display === 'flex';
      const modalCreateVisible = document.getElementById('modal-create-book').style.display === 'flex';

      // Chỉ kích hoạt xử lý khi 1 trong 2 Hộp thoại đang mở
      if (!modalSaveVisible && !modalCreateVisible) return;

      const clipboardData = e.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      const items = clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          
          // Khởi tạo đối tượng DataTransfer để đẩy dữ liệu vào Input File
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(file);

          if (modalSaveVisible) {
            document.getElementById('cover-upload').files = dataTransfer.files;
            document.getElementById('save-paste-msg').style.display = 'block';
          } else if (modalCreateVisible) {
            document.getElementById('only-cover-upload').files = dataTransfer.files;
            document.getElementById('create-paste-msg').style.display = 'block';
          }
          
          e.preventDefault(); // Hủy sự kiện mặc định
          break;
        }
      }
    });

    function closeModals() {
      document.getElementById('modal-save').style.display = 'none';
      document.getElementById('modal-create-book').style.display = 'none';
      // Reset thông báo dán ảnh
      document.getElementById('save-paste-msg').style.display = 'none';
      document.getElementById('create-paste-msg').style.display = 'none';
    }

    function openCreateBookModal() {
      document.getElementById('modal-create-book').style.display = 'flex';
      document.getElementById('create-paste-msg').style.display = 'none';
      document.getElementById('only-cover-upload').value = '';
    }

    function showSaveModal() {
      document.getElementById('modal-save').style.display = 'flex';
      document.getElementById('save-paste-msg').style.display = 'none';
      document.getElementById('modal-save-title').innerText = currentPageId ? "Đổi Vị Trí Lưu Trữ" : "Chọn Vị Trí Lưu Trữ";
      const list = document.getElementById('modal-book-list');
      list.innerHTML = '';
      db.books.forEach(book => {
        list.innerHTML += `<div class="book-option" onclick="document.getElementById('new-book-name').value = '${book.id}'">${book.name}</div>`;
      });
      document.getElementById('new-book-name').value = '';
      document.getElementById('cover-upload').value = '';
    }

    // Tự động lưu Nội dung Editor (Auto-save)
    document.getElementById('editor-content').addEventListener('input', () => {
      if(!isEditMode) return;
      document.getElementById('save-status').innerText = 'Đang ghi...';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        document.getElementById('save-status').innerText = 'Đã lưu tạm';
      }, 1000);
    });

    function insertImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = img.height * (800 / img.width);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgHtml = `<img src="${canvas.toDataURL('image/jpeg', 0.8)}" alt="media">`;
            document.getElementById('editor-content').focus();
            document.execCommand('insertHTML', false, imgHtml);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function generatePastelPalette(canvas, ctx, count) {
      let palette = [];
      for (let i = 0; i < count; i++) {
        let x = Math.floor(Math.random() * canvas.width);
        let y = Math.floor(Math.random() * canvas.height);
        let pixel = ctx.getImageData(x, y, 1, 1).data;
        let r = Math.floor((pixel[0] + 255 * 2) / 3);
        let g = Math.floor((pixel[1] + 255 * 2) / 3);
        let b = Math.floor((pixel[2] + 255 * 2) / 3);
        palette.push(`rgb(${r}, ${g}, ${b})`);
      }
      return palette;
    }

    function executeSaveAction() {
      const title = document.getElementById('editor-title').value;
      const content = document.getElementById('editor-content').innerHTML;
      const bookInput = document.getElementById('new-book-name').value;
      const coverFile = document.getElementById('cover-upload').files[0];

      if (!bookInput) return alert("Yêu cầu định danh phân loại sách.");

      let targetBookId = bookInput;
      const existingBook = db.books.find(b => b.id === bookInput);
      
      const finalizeAction = (coverDataUrl, dynamicPalette) => {
        if (!existingBook) {
          targetBookId = 'book_' + Date.now();
          db.books.push({ id: targetBookId, name: bookInput, cover: coverDataUrl || null, palette: dynamicPalette || fallbackColors });
        }
        if (currentPageId) {
          const page = db.pages.find(p => p.id === currentPageId);
          page.title = title; page.content = content; page.bookId = targetBookId;
        } else {
          currentPageId = 'page_' + Date.now();
          db.pages.push({ id: currentPageId, bookId: targetBookId, title: title, content: content, timestamp: Date.now() });
        }
        
        saveDB();
        closeModals();
        document.getElementById('editor-secondary-actions').style.display = 'flex';
        setEditorMode(false); 
      };

      if (coverFile && !existingBook) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = img.height * (400 / img.width);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            finalizeAction(canvas.toDataURL('image/jpeg', 0.8), generatePastelPalette(canvas, ctx, 5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(coverFile);
      } else {
        finalizeAction(null, null);
      }
    }

    function executeCreateBook() {
      const bookName = document.getElementById('only-new-book-name').value;
      const coverFile = document.getElementById('only-cover-upload').files[0];
      if (!bookName) return alert("Yêu cầu nhập tên sách.");
      
      const finalizeCreate = (coverDataUrl, dynamicPalette) => {
        db.books.push({ id: 'book_' + Date.now(), name: bookName, cover: coverDataUrl || null, palette: dynamicPalette || fallbackColors });
        saveDB();
        closeModals();
        document.getElementById('only-new-book-name').value = '';
        renderBooks();
      };

      if (coverFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = img.height * (400 / img.width);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            finalizeCreate(canvas.toDataURL('image/jpeg', 0.8), generatePastelPalette(canvas, ctx, 5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(coverFile);
      } else {
        finalizeCreate(null, null);
      }
    }

    function saveDB() {
      try { localStorage.setItem('diary_db', JSON.stringify(db)); return true; } 
      catch (e) { alert("Lỗi phân vùng: Bộ nhớ đệm đã đầy."); return false; }
    }
  </script>
</body>
</html>
